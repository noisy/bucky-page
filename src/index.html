<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bucky</title>
  <meta name="description" content="Bucky: screen time your kids earn. Czas przed ekranem, na który dzieci zapracowały.">
  <meta name="color-scheme" content="light dark">
{{hreflang_links}}
  <link rel="icon" href="static/img/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="stylesheet" href="static/css/site.css">
  <script>
    // Picks the language: an explicit earlier choice, then the domain (bucky.pl is Polish),
    // then the browser's preferred languages, then the fallback.
    (function (config) {
      var available = function (code) { return config.languages.indexOf(code) !== -1 ? code : null; };
      var saved = null;
      try { saved = available(localStorage.getItem("bucky-lang")); } catch (e) {}
      var byDomain = available(config.domains[location.hostname.toLowerCase()] || "");
      var byBrowser = null;
      var preferred = navigator.languages || [navigator.language || ""];
      for (var i = 0; i < preferred.length && !byBrowser; i++) {
        byBrowser = available(String(preferred[i]).toLowerCase().split("-")[0]);
      }
      location.replace((saved || byDomain || byBrowser || config.fallback) + "/" + location.hash);
    })({{language_detection}});
  </script>
</head>
<body class="chooser">
  <main class="chooser-card">
    <img src="static/img/bucky-happy.webp" alt="" width="320" height="276">
    <h1>Bucky</h1>
    <ul class="chooser-links">{{language_buttons}}</ul>
  </main>
</body>
</html>
